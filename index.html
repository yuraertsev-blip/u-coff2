<!DOCTYPE html>
<html>
<head>
  <base href="/u-coff2/">
  <meta charset="UTF-8">
  <title>Ю Кофе</title>
  <meta name="description" content="Управление рабочим графиком кофейни Ю Кофе">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4E342E">

  <!-- iOS PWA (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ю Кофе">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->

  <!-- iOS splash screen background -->

    body { background-color: #4E342E; margin: 0; }
  </style>
</head>
<body>
  <!-- Подключение к базе живёт в Dart (lib/supabase_config.dart). -->

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
