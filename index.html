<!DOCTYPE html>
<html>
<head>
  <base href="/u-coff2/">
  <meta charset="UTF-8">
  <title>Ю Кофе</title>
  <meta name="description" content="Управление рабочим графиком кофейни Ю Кофе">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4E342E">

  <!-- iOS PWA (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ю Кофе">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- iOS splash screen background -->
  <style>
    body { background-color: #4E342E; margin: 0; }
  </style>
</head>
<body>
  <!-- Подключение к базе живёт в Dart (lib/supabase_config.dart). -->

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Своего service worker здесь больше нет.
    //
    // Раньше тут регистрировался sw.js. Он занимал scope, который нужен
    // штатному flutter_service_worker.js, и кэшировал index.html,
    // flutter_bootstrap.js и main.dart.js по отдельности. При обрыве связи
    // файлы оказывались из разных сборок, приложение не запускалось и само не
    // чинилось — кэш оставался битым. Теперь кэшем PWA занимается Flutter: он
    // сверяет файлы по манифесту и переключает сборку целиком.
    //
    // Снимаем старый sw.js у тех, кому он уже успел установиться, иначе они
    // останутся на сломанном кэше навсегда.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          // Сверяем по всем трём состояниям: у регистрации Flutter в момент
          // установки ещё нет active, и по пустой строке мы снесли бы её же.
          var w = reg.active || reg.waiting || reg.installing;
          if (w && /\/sw\.js(\?|$)/.test(w.scriptURL)) reg.unregister();
        });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        names.forEach(function (n) {
          if (n.indexOf('u-coffee-') === 0) caches.delete(n);
        });
      }).catch(function () {});
    }
  </script>
</body>
</html>
