name: Бэкап графика

# Раз в сутки складывает содержимое базы JSON-файлами в сам репозиторий.
# Так данные лежат в двух независимых местах, а история версий — это история git.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC, то есть 06:00 по Москве
  workflow_dispatch:       # и кнопкой вручную, когда нужно

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Забрать данные из Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Не заданы секреты SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY" >&2
            exit 1
          fi
          mkdir -p backups
          for table in baristas shifts prefs logs; do
            # -f роняет шаг на любой ошибке HTTP, чтобы не закоммитить мусор
            curl -sSf "${SUPABASE_URL}/rest/v1/${table}?select=*" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
            | jq --sort-keys . > "backups/${table}.json"
          done
          wc -c backups/*.json

      - name: Закоммитить, если что-то изменилось
        run: |
          set -euo pipefail
          git config user.name  "u-coffee backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "Бэкап графика за $(date -u +%Y-%m-%d)"
            git push
          fi
